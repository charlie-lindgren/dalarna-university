name: Deploy site to GitHub Pages

# The site in site/ (Astro), built from the vault and published at /dalarna-university/.
# Every address of the old Quartz site still answers: the build writes a redirect page at
# each one (site/scripts/redirects.ts). If the build fails, nothing is deployed and the
# previous version stays online.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Build the site
        working-directory: site
        run: |
          npm ci
          npm run build
      # Either check failing stops the deploy: a broken link, or plan text that differs
      # from the vault by a single word.
      - name: Check the links
        working-directory: site
        run: node scripts/check-links.mjs
      - name: Check the plan text against the vault
        working-directory: site
        run: node scripts/check-fidelity.ts
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
