name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Dependencies
        run: npm ci
      - name: Build Quartz
        run: npx quartz build

      # The new site (site/), published beside the live one as a preview at
      # /dalarna-university/next/. Each of these steps is allowed to fail: a problem
      # in the preview must never stop the live site from deploying.
      - name: Set up Node for the preview
        id: preview-node
        continue-on-error: true
        uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Build the preview
        id: preview
        if: steps.preview-node.outcome == 'success'
        continue-on-error: true
        working-directory: site
        env:
          SITE_BASE: /dalarna-university/next
        run: |
          npm ci
          npm run build
      - name: Add the preview to the published site
        if: steps.preview.outcome == 'success'
        continue-on-error: true
        run: rm -rf public/next && cp -R site/dist public/next

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
